# English texts of the Telegram bot (domain "bot"); the keys are the Russian source strings.
# A missing key falls back to Russian. %placeholders% are filled by the code.

# Dates: ICU pattern of a day in bot messages.
"dd.MM.y": "d MMM y"

# Commands and the help text
"Привет, %name%! Ты в списке участников.": "Hi, %name%! You are on the participant list."
"Трата — одним сообщением: сумма, валюта, категория, дата, заметка.": "One message per expense: amount, currency, category, date, note."
"17000 продукты": "17000 groceries"
"18,5 eur чатгпт 10.11": "18.5 eur chatgpt 10.11"
"9700 доставка кари вчера": "9700 delivery pizza yesterday"
"9700 доставка вчера": "9700 delivery yesterday"
"700 кофе лично": "700 coffee personal"
"3000 цветы ей": "3000 flowers her"
"-2500 руб возврат": "-2500 rub refund"
"только моя трата": "only my expense"
"целиком за другого": "entirely for the other person"
"возврат денег": "money back"
"Команды:": "Commands:"
"регистрация и эта справка": "sign up and this help"
"кто кому сколько должен": "who owes whom how much"
"итоги месяца: /month, /month 10, /month 10.2025": "month summary: /month, /month 10, /month 10.2025"
"CSV трат за месяц: /export, /export 10": "CSV of the month's expenses: /export, /export 10"
"записать мой перевод второму участнику: /settle 2500 руб": "record my payment to the other participant: /settle 2500 rub"
"удалить мою последнюю запись": "delete my last entry"
"язык бота: /language en, /language ru": "bot language: /language en, /language ru"
"Не знаю такую команду. Список команд — /start": "I don't know this command. All commands: /start"

# /language
"Язык бота: %language%. Сменить: %options%": "Bot language: %language%. To switch: %options%"
"Такого языка нет. Можно так: %options%": "No such language. Try: %options%"

# Expense card
"платил(а) %name%": "paid by %name%"
"пополам": "split in half"
"личное": "personal"
"за другого": "for the other"
"Категория": "Category"
"Удалить": "Delete"
"Удалено": "Deleted"
"Назад": "Back"
"Категория: %category%": "Category: %category%"
"Кнопка устарела.": "This button is out of date."
"Курса %currency% на %date% пока нет — пересчитаю, когда он появится.": "No %currency% rate for %date% yet — I will convert it once it is published."

