# Balance and settling up
"Пока зарегистрирован один участник — второй должен написать боту /start.": "Only one participant so far: the other one should send /start to the bot."
"<b>%debtor%</b> должен(на) <b>%creditor%</b> %amount%": "<b>%debtor%</b> owes <b>%creditor%</b> %amount%"
"Никто никому не должен.": "Nobody owes anybody."
"Без курса и пока не учтено записей: %count%.": "Entries without a rate, not counted yet: %count%."
"Баланс": "Balance"
"Укажи сумму перевода: /settle 2500 руб": "Give the amount you sent: /settle 2500 rub"
"Перевод записан: <b>%from% → %to%</b> %amount%": "Payment recorded: <b>%from% → %to%</b> %amount%"
"курса пока нет, в баланс попадёт позже": "no rate yet, it will count in the balance later"

# Month summary and export
"<b>%month%</b>: трат нет.": "<b>%month%</b>: no expenses."
"Всего: <b>%total%</b>": "Total: <b>%total%</b>"
"По категориям": "By category"
"По участникам": "By participant"
"%name%: заплатил(а) %paid%, доля %share%": "%name%: paid %paid%, share %share%"
"Трат без курса, не вошли в итог: %count%.": "Expenses without a rate, left out of the total: %count%."
"За %month% трат нет.": "No expenses in %month%."
"Траты: %month%": "Expenses: %month%"

