name: money-spent

x-php: &php
    build:
        context: .
        dockerfile: docker/php/Dockerfile
    image: money-spent-php:dev
    working_dir: /app
    volumes:
        - ./:/app
    environment:
        DATABASE_URL: 'postgresql://app:${POSTGRES_PASSWORD:-app}@db:5432/app?serverVersion=16&charset=utf8'

services:
    db:
        image: postgres:16-alpine
        environment:
            POSTGRES_DB: app
            POSTGRES_USER: app
            POSTGRES_PASSWORD: '${POSTGRES_PASSWORD:-app}'
        volumes:
            - db-data:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U app -d app']
            interval: 3s
            timeout: 3s
            retries: 20

    init:
        <<: *php
        command: ['sh', 'docker/php/init.sh']
        restart: 'no'
        depends_on:
            db:
                condition: service_healthy

    php-fpm:
        <<: *php
        restart: unless-stopped
        depends_on:
            init:
                condition: service_completed_successfully

    nginx:
        image: nginx:1.27-alpine
        restart: unless-stopped
        ports:
            - '127.0.0.1:${HTTP_PORT:-8080}:80'
        volumes:
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
            - ./public:/app/public:ro
        depends_on:
            - php-fpm
        healthcheck:
            test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1/health || exit 1']
            interval: 10s
            timeout: 3s
            retries: 5

    worker:
        <<: *php
        command:
            - php
            - bin/console
            - messenger:consume
            - scheduler_default
            - --time-limit=3600
            - --memory-limit=128M
        restart: unless-stopped
        depends_on:
            init:
                condition: service_completed_successfully

    poller:
        <<: *php
        command: ['php', 'bin/console', 'app:telegram:poll']
        restart: unless-stopped
        profiles: ['polling']
        depends_on:
            init:
                condition: service_completed_successfully

volumes:
    db-data:
